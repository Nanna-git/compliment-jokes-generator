<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Joys. | Compliments &amp; jokes</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #29233d;
      --muted: #686379;
      --purple: #7158d9;
      --border: #ded7e9;
      --serif: Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font: 1rem/1.5 var(--sans);
      background-color: #faf9ff;
      background-image:
        radial-gradient(ellipse at 12% 32%, #f9e5ee91, transparent 39%),
        radial-gradient(ellipse at 88% 66%, #e2d8fb9c, transparent 44%),
        radial-gradient(#9583a825 .7px, transparent .9px);
      background-size: auto, auto, 13px 13px;
    }

    header, main { width: calc(100% - 2rem); margin-inline: auto; }
    header {
      max-width: 72rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: 1rem .15rem;
      border-bottom: 1px solid #dcd4e7;
    }

    .brand { display: flex; align-items: center; gap: .55rem; }
    .brand svg { width: 2.2rem; height: 2.2rem; transform: rotate(-8deg); }
    .brand strong { font: 600 1.65rem/1 var(--serif); letter-spacing: -.075em; }
    .brand b, h1 em { color: var(--purple); }
    .descriptor, footer { color: var(--muted); font-size: .81rem; }
    main { flex: 1; max-width: 43rem; }
    .intro { text-align: center; padding: clamp(2rem, 6vh, 4rem) 0 1.6rem; }
    h1 { margin: 0; font: 600 clamp(2.55rem, 7vw, 4.3rem)/1.04 var(--serif); letter-spacing: -.06em; }
    h1 em { font-weight: 500; }
    .intro p { margin: 1rem auto 0; color: var(--muted); text-wrap: balance; }

    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    .sr-only, .filters input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .filters, .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
    .filters label { position: relative; cursor: pointer; }
    .filters span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: .45rem .9rem;
      border: 1px solid var(--border);
      border-radius: 3rem;
      background: #ffffffdb;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 600;
    }

    .filters span::before {
      content: "";
      width: .45rem;
      height: .23rem;
      margin-right: .36rem;
      border-left: 2px solid;
      border-bottom: 2px solid;
      transform: translateY(-1px) rotate(-45deg);
      visibility: hidden;
    }

    .filters input:checked + span {
      color: white;
      border-color: #5b42bf;
      background: linear-gradient(155deg, var(--purple), #5b42bf);
      box-shadow: inset 0 1px 0 #ffffff36, 0 2px 5px #49347820;
    }
    .filters input:checked + span::before { visibility: visible; }

    button:focus-visible, textarea:focus-visible, .filters input:focus-visible + span {
      outline: 3px solid #49388a;
      outline-offset: 4px;
    }

    /* The paper, stamp, and controls retain their positions during a reveal. */
    .stack { position: relative; isolation: isolate; margin: 1.8rem .55rem 1.9rem; }
    .stack::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: .45rem -.16rem -.24rem;
      border: 1px solid #d4c6e3;
      border-radius: 1.1rem;
      background: linear-gradient(125deg, #efe4f6, #ddd0ee);
      transform: rotate(-1.45deg);
      box-shadow: 0 18px 30px -17px #57446e53;
    }

    .postcard {
      --wash: #f7e9f2;
      --stamp-paper: #f9dce6;
      --stamp-ink: #98486a;
      --stamp-edge: #c998b0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      min-height: 18.5rem;
      padding: 1.4rem clamp(1.15rem, 5vw, 2.55rem) 1.05rem;
      border: 1px solid #ded1dc;
      border-radius: 1rem;
      background:
        radial-gradient(ellipse at 99% 0%, var(--wash), transparent 43%),
        linear-gradient(155deg, #fff, #fffdfb 65%, #f9f5f1);
      box-shadow: inset 0 0 0 4px #ffffff70, 0 2px 4px #65546f16;
    }

    .postcard[data-kind="Motivation"] {
      --wash: #faf0d9; --stamp-paper: #f8e7bd; --stamp-ink: #85582a; --stamp-edge: #c7ac7b;
    }
    .postcard[data-kind="Kindness"] {
      --wash: #e6f2e7; --stamp-paper: #d8ebda; --stamp-ink: #466a4d; --stamp-edge: #9cb89d;
    }
    .postcard[data-kind="Confidence"] {
      --wash: #ede7fb; --stamp-paper: #e5dcf8; --stamp-ink: #6b528d; --stamp-edge: #ae9cc5;
    }
    .postcard[data-kind="Joke"] {
      --wash: #fff0df; --stamp-paper: #ffe4bd; --stamp-ink: #855025; --stamp-edge: #d4ab80;
    }

    .postcard::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: .4rem;
      background: repeating-linear-gradient(
        125deg, #baa8dc 0 12px, #fffaf7 12px 24px,
        #eaa1b9 24px 36px, #fffaf7 36px 48px
      );
    }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .address, .signature { color: var(--muted); font: italic 1.14rem var(--serif); }
    .address { padding-top: .55rem; }
    .address i { padding-inline: .15rem 1.7rem; border-bottom: 1px solid #d6cad8; }
    .postage { display: flex; align-items: center; padding-right: .2rem; }
    .postmark { width: clamp(3.5rem, 11vw, 5.4rem); margin-right: -.75rem; z-index: 1; }

    .stamp {
      position: relative;
      display: grid;
      place-items: center;
      width: 3.35rem;
      height: 4rem;
      color: var(--stamp-ink);
      transform: rotate(8deg);
      filter: drop-shadow(1px 2px 1px #49344d26);
    }

    .stamp::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--stamp-paper);
      mask:
        linear-gradient(#000 0 0) center / calc(100% - 6px) calc(100% - 6px) no-repeat,
        radial-gradient(circle, #000 58%, transparent 63%) 0 0 / 6px 6px round;
    }
    .stamp svg {
      position: relative;
      width: calc(100% - 11px);
      height: calc(100% - 11px);
      border: 1px solid var(--stamp-edge);
    }

    .message { width: 100%; margin: auto; padding: .7rem 0 1rem; text-align: center; }
    .kind { color: var(--stamp-ink); font-size: .74rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .quote-space {
      display: grid;
      max-width: 30ch;
      margin: .55rem auto 0;
      font: 500 clamp(1.5rem, 3.9vw, 2rem)/1.28 var(--serif);
      letter-spacing: -.036em;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .quote-space > * { grid-area: 1 / 1; align-self: center; }
    .quote-space p { margin: 0; }
    .measure { visibility: hidden; pointer-events: none; user-select: none; }
    .quote-space .punchline {
      margin: .65rem 0 0;
      color: #80502e;
      font-size: .82em;
      font-style: italic;
      letter-spacing: -.015em;
    }
    .waiting { visibility: hidden; }
    .signature { align-self: flex-end; font-size: .98rem; }
    .signature span, footer span { color: #ad5577; }

    /* The button face lifts while its clickable area stays in place. */
    .actions { gap: .7rem; }
    .action-button {
      position: relative;
      display: inline-grid;
      padding: 0;
      border: 0;
      border-radius: .95rem;
      background: transparent;
      color: var(--ink);
      font: 600 .94rem var(--sans);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .button-face {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: 3rem;
      padding: .65rem 1.05rem;
      border: 1px solid var(--border);
      border-radius: inherit;
      background: linear-gradient(#fff, #fbf8ff);
      box-shadow: inset 0 1px 0 #fff, 0 2px 0 #ded7e7;
    }
    .button-face svg { width: 1.1rem; height: 1.1rem; flex: none; }

    #generate .button-face {
      color: white;
      border-color: #5b42bf;
      background: linear-gradient(155deg, #785fdb, #644ac7 72%);
      box-shadow: inset 0 1px 0 #ffffff52, 0 3px 0 #503aa2, 0 6px 14px #7057b02b;
    }
    #joke .button-face {
      border-color: #d6b998;
      color: #704424;
      background: linear-gradient(155deg, #fff3e2, #f9debb);
      box-shadow: inset 0 1px 0 #fff9, 0 2px 0 #d8b898;
    }

    .sparkles::before, .sparkles::after {
      content: "";
      position: absolute;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      top: -8px;
      right: 6px;
      width: 12px;
      height: 15px;
      background: #ad79c7;
      clip-path: polygon(50% 0, 61% 35%, 100% 50%, 62% 62%, 50% 100%, 38% 63%, 0 50%, 38% 37%);
    }
    .sparkles::after { width: 7px; height: 9px; top: 1px; right: -3px; background: #d37da0; }
    #joke .sparkles::before { background: #c9904f; }
    .action-button:focus-visible .sparkles::before,
    .action-button:focus-visible .sparkles::after { opacity: 1; }

    @media (hover: hover) and (pointer: fine) {
      .filters label:hover input:not(:checked) + span { border-color: #bfaed4; background: #f7f1fc; }
      .action-button:hover .button-face { filter: brightness(1.035); }
      .action-button:hover .sparkles::before, .action-button:hover .sparkles::after { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .button-face, .filters span { transition: transform 170ms ease-out, border-color 170ms ease-out; }
      .action-button:active .button-face { transform: translateY(1px); }
      .punchline.revealed { animation: punchline-in 360ms ease-out both; }
    }
    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      .action-button:hover .button-face { transform: translateY(-3px); }
      .action-button:hover:active .button-face { transform: translateY(1px); }
      .filters label:hover span { transform: translateY(-2px); }
      .action-button:hover .sparkles::before, .action-button:hover .sparkles::after {
        animation: twinkle 550ms ease-out both;
      }
      .action-button:hover .sparkles::after { animation-delay: 70ms; }
    }
    @keyframes twinkle {
      from { opacity: 0; transform: translateY(3px) scale(.3) rotate(-16deg); }
      45% { opacity: 1; transform: translateY(-2px) scale(1.12); }
      to { opacity: .85; transform: translateY(-2px) scale(.82); }
    }
    @keyframes punchline-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #status { min-height: 1.5rem; margin: .6rem 0 .2rem; color: var(--muted); text-align: center; font-size: .875rem; }
    #manual { max-width: 32rem; margin: 0 auto 1rem; }
    textarea { display: block; width: 100%; margin-top: .45rem; padding: .7rem; font: inherit; }
    footer { padding: 1rem; text-align: center; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }

    @media (max-width: 32rem) {
      .filters, .actions { gap: .4rem; }
      .filters span { padding-inline: .65rem; }
      .button-face { padding-inline: .8rem; }
      .descriptor { font-size: .75rem; }
      .stack { margin-block: 1.45rem 1.6rem; }
    }
  </style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="tulip" viewBox="0 0 40 50">
        <path d="M20 43q-3-12 0-23m-1 17q-9-1-12-9 10 1 12 9m0-5q9-1 12-10-9 2-12 10" fill="#78947a" stroke="#58745e" stroke-width="1.2"/>
        <path d="M20 26Q8 21 9 9l7 5 4-8 4 8 7-6q1 14-11 18Z" fill="#de85a1" stroke="currentColor" stroke-width="1.3"/>
      </symbol>
      <symbol id="sunrise" viewBox="0 0 40 50">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M10 29a10 10 0 0 1 20 0" fill="#e8b65d"/>
          <path d="M20 10v4m-12 2 3 3m21-3-3 3M4 25l4 1m28-1-4 1M4 30q7-3 15 0t17 0M7 35q7-2 14 0t12 0m-21 5q7-2 16 0"/>
        </g>
      </symbol>
      <symbol id="sprout" viewBox="0 0 40 50">
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 37V24" fill="none"/>
          <path d="M20 28Q7 27 6 15q13 0 14 13Z" fill="#91b49a"/>
          <path d="M20 24Q21 10 34 9q-1 13-14 15Z" fill="#aac786"/>
          <path d="m12 20 8 8m7-12-7 8M8 39q12-7 24 0m-20 4q8-3 16 0" fill="none"/>
        </g>
      </symbol>
      <symbol id="comet" viewBox="0 0 40 50">
        <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="m25 9 2.4 6 6.6.7-5 4.3 1.4 6.5-5.4-3.6-5.8 3.3 1.7-6.4-4.7-4.6 6.5-.4Z" fill="#f5d383"/>
          <path d="M20 25Q14 35 6 38m17-10q-6 10-13 13m14-8-4 6" fill="none"/>
        </g>
      </symbol>
      <symbol id="popper" viewBox="0 0 40 50">
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 40 6-21 12 12Z" fill="#eaa4a8"/>
          <path d="m11 31 7 5m-5-13 11 9" fill="none"/>
          <ellipse cx="20" cy="25" rx="3.5" ry="8" transform="rotate(-47 20 25)" fill="#f8cb81"/>
          <path d="M22 18q6-2 2-6t5-5m-10 9-1-5m10 11 5-2" fill="none"/>
        </g>
        <circle cx="32" cy="11" r="1.8" fill="#987ac3"/>
        <circle cx="12" cy="12" r="1.5" fill="#d48096"/>
        <path d="m34 26 2 2-2 2-2-2Z" fill="#9c79b9"/>
      </symbol>
    </defs>
  </svg>

  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 9h26v19H3z" fill="#f6e4ef" stroke="#63499a" stroke-width="1.6"/>
        <path d="m3 28 9-10m17 10-9-10M3 9l13 12L29 9" fill="none" stroke="#63499a" stroke-width="1.6"/>
        <path d="M16 15S7 10 9 5.5c1.4-3 5.2-2.3 7 .6 2.2-3.2 5.8-3.3 7-.5 1.9 4-7 9.4-7 9.4Z" fill="#ff8fad" stroke="#63499a" stroke-width="1.3"/>
      </svg>
      <strong>little joys<b>.</b></strong>
    </div>
    <span class="descriptor">Compliments &amp; jokes</span>
  </header>

  <main>
    <section class="intro" aria-labelledby="headline">
      <h1 id="headline">A little kindness<br><em>goes a long way.</em></h1>
      <p>A kind word or a little laugh, signed and sealed for you.</p>
    </section>

    <section aria-label="Generate a compliment or joke">
      <fieldset>
        <legend class="sr-only">Choose a compliment category</legend>
        <div class="filters">
          <label><input type="radio" name="category" value="All" checked><span>All</span></label>
          <label><input type="radio" name="category" value="Motivation"><span>Motivation</span></label>
          <label><input type="radio" name="category" value="Friendship"><span>Friendship</span></label>
          <label><input type="radio" name="category" value="Kindness"><span>Kindness</span></label>
          <label><input type="radio" name="category" value="Confidence"><span>Confidence</span></label>
        </div>
      </fieldset>

      <div class="stack">
        <article id="postcard" class="postcard" data-kind="Friendship" aria-label="Your postcard">
          <div class="card-head">
            <span class="address">To: <i>you</i></span>
            <div class="postage" aria-hidden="true">
              <svg class="postmark" viewBox="0 0 90 45">
                <path d="M2 14c16-12 28 9 44 0s28-1 42 1M2 21c16-12 28 9 44 0s28-1 42 1M2 28c16-12 28 9 44 0s28-1 42 1" fill="none" stroke="#aa9cb5" stroke-width="1.25"/>
              </svg>
              <div class="stamp">
                <svg viewBox="0 0 40 50"><use id="stamp-art" href="#tulip"/></svg>
              </div>
            </div>
          </div>
          <div class="message">
            <span id="kind" class="kind">Friendship</span>
            <div id="quote-space" class="quote-space">
              <div>
                <p id="line">You remember the little things people tell you in passing.</p>
                <p id="punchline" class="punchline" hidden></p>
              </div>
            </div>
          </div>
          <div class="signature" aria-hidden="true"><span>♡</span> little joys.</div>
        </article>
      </div>

      <div class="actions">
        <button id="generate" class="action-button" type="button">
          <span class="button-face"><span aria-hidden="true">✦</span> Another Compliment</span>
          <span class="sparkles" aria-hidden="true"></span>
        </button>
        <button id="joke" class="action-button" type="button">
          <span class="button-face">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M3 11a9 9 0 1 1 5 8l-4 1 1-4a9 9 0 0 1-2-5Z"/>
              <path d="M8 12.5q4 5 8 0"/>
              <circle cx="9" cy="9" r=".8" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="9" r=".8" fill="currentColor" stroke="none"/>
            </svg>
            Tell Me a Joke
          </span>
          <span class="sparkles" aria-hidden="true"></span>
        </button>
        <button id="copy" class="action-button" type="button" aria-label="Copy this compliment">
          <span class="button-face">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <rect x="8" y="8" width="12" height="13" rx="2"/>
              <path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
            </svg>
            Copy
          </span>
          <span class="sparkles" aria-hidden="true"></span>
        </button>
      </div>
      <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      <p id="status" role="status"></p>
      <div id="manual" hidden>
        <label for="copy-text">Use your device’s copy command on the selected text.</label>
        <textarea id="copy-text" rows="3" readonly></textarea>
      </div>
    </section>
  </main>
  <footer>Made to make you smile <span aria-hidden="true">♡</span></footer>

  <script>
    "use strict";

    const compliments = {

        "You find a small first step when a project feels enormous.",
        "I like how you give a rough first draft a chance to become something.",

        "Your willingness to be a beginner makes learning alongside you easier.",

        "You make room for a break and still find your way back.",

    // Each entry is [setup, punchline], or [one-liner] for an instant joke.
    const jokes = [

    const stamps = {
      Motivation: "#sunrise",
      Friendship: "#tulip",
      Kindness: "#sprout",
      Confidence: "#comet",
      Joke: "#popper"
    };

    const categories = Object.keys(compliments);
    const pools = new Map();
    const card = document.querySelector("#postcard");
    const kind = document.querySelector("#kind");
    const line = document.querySelector("#line");
    const punchline = document.querySelector("#punchline");
    const art = document.querySelector("#stamp-art");
    const announcement = document.querySelector("#announcement");
    const status = document.querySelector("#status");
    const manual = document.querySelector("#manual");
    const copyText = document.querySelector("#copy-text");
    const copyButton = document.querySelector("#copy");

    let jokePool = [];
    let lastJoke;
    let lastCompliment;
    let revealTimer;
    let copyRevision = 0;
    let currentText = "";

    // Size the shared grid once so even a long punchline cannot push the buttons down.
    const sizingFragment = document.createDocumentFragment();
    const cardsToMeasure = [
      ...Object.values(compliments).flat().map(text => [text]),
      ...jokes
    ];

    for (const [firstLine, secondLine] of cardsToMeasure) {
      const sample = document.createElement("div");
      sample.className = "measure";
      sample.setAttribute("aria-hidden", "true");
      const first = document.createElement("p");
      first.textContent = firstLine;
      sample.append(first);
      if (secondLine) {
        const second = document.createElement("p");
        second.className = "punchline";
        second.textContent = secondLine;
        sample.append(second);
      }
      sizingFragment.append(sample);
    }
    document.querySelector("#quote-space").append(sizingFragment);

    function randomIndex(length) {
      return Math.floor(Math.random() * length);
    }

    function takeRandom(pool, previous) {
      let index = randomIndex(pool.length);
      if (pool.length > 1 && pool[index] === previous) {
        index = (index + 1 + randomIndex(pool.length - 1)) % pool.length;
      }
      return pool.splice(index, 1)[0];
    }

    function refill(category) {
      pools.set(category, [...compliments[category]]);
    }

    categories.forEach(refill);
    lastCompliment = pools.get("Friendship").shift();
    line.textContent = lastCompliment;
    currentText = lastCompliment;

    function showCard(category, firstLine, secondLine = "") {
      // A new draw cancels any punchline still waiting from the previous joke.
      clearTimeout(revealTimer);
      copyRevision++;
      manual.hidden = true;
      status.textContent = "";
      card.dataset.kind = category;
      kind.textContent = category;
      art.setAttribute("href", stamps[category]);
      line.textContent = firstLine;
      punchline.className = "punchline waiting";
      punchline.textContent = secondLine;
      punchline.hidden = !secondLine;

      // Copy always includes the complete joke, even during its comic pause.
      currentText = secondLine ? `${firstLine}\n${secondLine}` : firstLine;
      copyButton.setAttribute("aria-label", category === "Joke" ? "Copy the full joke" : "Copy this compliment");
      announcement.textContent = `${category}. ${firstLine}`;

      if (secondLine) {
        revealTimer = setTimeout(() => {
          punchline.className = "punchline revealed";
          announcement.textContent = secondLine;
        }, 2500);
      }
    }

    function showCompliment() {
      let category = document.querySelector('input[name="category"]:checked').value;
      if (category === "All") {
        let available = categories.filter(name => pools.get(name).length > 0);
        if (available.length === 0) {
          categories.forEach(refill);
          available = categories;
        }
        category = available[randomIndex(available.length)];
      } else if (pools.get(category).length === 0) {
        refill(category);
      }
      lastCompliment = takeRandom(pools.get(category), lastCompliment);
      showCard(category, lastCompliment);
    }

    function showJoke() {
      if (jokePool.length === 0) jokePool = [...jokes];
      lastJoke = takeRandom(jokePool, lastJoke);
      showCard("Joke", ...lastJoke);
    }

    async function copyCard() {
      const text = currentText;
      const request = ++copyRevision;
      status.textContent = "";
      manual.hidden = true;
      try {
        await navigator.clipboard.writeText(text);
        if (request === copyRevision) status.textContent = "Copied!";
        return;
      } catch {
        if (request !== copyRevision) return;
      }

      manual.hidden = false;
      copyText.value = text;
      copyText.focus();
      copyText.select();
      try {
        if (document.execCommand("copy")) {
          manual.hidden = true;
          copyButton.focus();
          status.textContent = "Copied!";
        }
      } catch {
        // The selected text remains ready for manual copying.
      }
    }

    document.querySelector("fieldset").addEventListener("change", showCompliment);
    document.querySelector("#generate").addEventListener("click", showCompliment);
    document.querySelector("#joke").addEventListener("click", showJoke);
    copyButton.addEventListener("click", copyCard);
  </script>
